<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>¿Cuánto te ama la pera?</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <style>
    body {
      background: linear-gradient(to right, #ffc0cb, #ffe4e1);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      font-family: 'Comic Sans MS', cursive, sans-serif;
    }

    .card {
      background: #fff0f5;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
      padding: 1rem;
    }

    h1 {
      color: #d81b60;
      margin-bottom: 1rem;
      font-size: 2rem;
    }

    .pera-img {
      width: 200px;
      margin-bottom: 1rem;
      transition: transform 0.3s ease;
    }

    .pera-img:hover {
      transform: scale(1.05);
    }

    .love-display {
      font-size: 2.5rem;
      color: #c2185b;
      margin: 1rem 0;
    }

    .love-message {
      font-size: 1.2rem;
      color: #6a1b9a;
      min-height: 2.5rem;
      margin-bottom: 1.5rem;
    }

    .btn-love {
      background-color: #ec407a;
      color: white;
      border: none;
      font-size: 1.2rem;
      padding: 0.8rem 2rem;
      border-radius: 12px;
      transition: background-color 0.3s ease;
    }

    .btn-love:hover {
      background-color: #ad1457;
    }

    .input-name {
      margin-bottom: 1rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-6 col-lg-5">
        <div class="card">
          <h1>💚 ¿Cuánto te ama la pera? 💚</h1>
          <img src="https://cdn.discordapp.com/attachments/1107833971145969664/1371249432913514506/cartoon-pear-icon-png.png?ex=6822730d&is=6821218d&hm=cef079c5cbac3e05931f168482b65e050e94798273e273548f09361f6c2fc751&" alt="Pera Amorosa" class="pera-img mx-auto d-block" />
          
          <!-- Campo para ingresar el nombre -->
          <input type="text" id="nameInput" class="form-control input-name" placeholder="Escribe tu nombre..." />
          <button onclick="startLove()" class="btn btn-love mb-3">Comenzar 💌</button>

          <!-- Sección oculta hasta ingresar el nombre -->
          <div id="loveSection" style="display:none;">
            <div class="love-display" id="loveDisplay">🍐 50% 🍐</div>
            <div class="love-message" id="loveMessage">La pera está pensando en ti... 🍃</div>
            <button onclick="changeLove()" class="btn btn-love">Descúbrelo 💘</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    let userName = '';

    function startLove() {
      const input = document.getElementById('nameInput');
      userName = input.value.trim();

      if (userName === '') {
        alert('Por favor, escribe tu nombre 🍐💬');
        return;
      }

      document.getElementById('loveSection').style.display = 'block';
      input.style.display = 'none';
      event.target.style.display = 'none';
    }

    function changeLove() {
      const love = Math.floor(Math.random() * 101);
      const display = document.getElementById("loveDisplay");
      const message = document.getElementById("loveMessage");

      display.textContent = `🍐 ${love}% 🍐`;

      if (love < 10) {
        message.textContent = `${userName}, esta pera te ve más como un/a amigo/a 🍐🙂`;
      } else if (love < 30) {
        message.textContent = `${userName}, la pera está confundida, pero le agradas 🍐🤔`;
      } else if (love < 50) {
        message.textContent = `${userName}, la pera siente algo... ¡quizás una chispa! ✨`;
      } else if (love < 70) {
        message.textContent = `¡Le encantas a esta pera, ${userName}! 🍐💕`;
      } else if (love < 90) {
        message.textContent = `¡${userName}, esta pera está super enamorada de ti! 💚`;
      } else {
        message.textContent = `¡${userName}, la pera está locamente enamorada! 💘🍐`;
      }
    }
  </script>
</body>
</html>
